version: '3.8'

services:
  crisis-app:
    build: .
    container_name: crisis_app
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Uncomment and adjust the volumes section if you need persistent data
    # volumes:
    #   - ./data:/usr/src/app/data
