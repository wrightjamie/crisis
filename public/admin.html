<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Wargame - Admin Console</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="/vendor/tagify/tagify.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left flex-center gap-md">
            <h1 class="top-bar-brand">
                <span>🛡️</span>
                <span>Crisis Admin Console</span>
            </h1>
            <nav class="top-bar-tabs">
                <button class="top-bar-tab nav-tab active" data-tab="scenarios">Scenarios</button>
                <button class="top-bar-tab nav-tab" data-tab="images">Image Library</button>
            </nav>
        </div>
        <div class="top-bar-right flex-center gap-sm">
            <button id="btn-toggle-bugs" class="btn btn-secondary text-sm flex-center gap-1" onclick="window.toggleBugReporting && window.toggleBugReporting()" title="Toggle Bug & Feedback System">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg>
                <span>Bugs:</span> <span id="header-bug-status" class="text-bold">OFF</span>
                <span id="header-sync-dot" class="bug-sync-dot amber" title="Local Storage Only"></span>
            </button>
            <a href="/facilitator" class="btn btn-secondary text-sm text-decoration-none" title="Go to Facilitator Console">🎮 Facilitator</a>
            <div class="user-pill" id="user-pill">
                <span>👤</span>
                <span id="username-display">admin</span>
            </div>
            <button id="btn-logout" class="btn btn-secondary text-sm" title="Log out">Log Out</button>
        </div>
    </header>

    <main class="admin-container">
        <!-- SCENARIOS TAB -->
        <section id="tab-scenarios">
            <div class="toolbar">
                <div class="toolbar-left">
                    <input type="text" id="scenario-search" class="search-input" placeholder="Search scenarios by name or description...">
                </div>
                <div class="toolbar-right">
                    <button type="button" class="btn btn-secondary text-sm" id="btn-export-all" title="Download all scenarios in a single archive">📦 Export All (.zip)</button>
                    <div class="file-upload-wrapper">
                        <input type="file" id="scenario-file-input" accept=".zip" style="display: none;">
                        <button type="button" class="btn btn-secondary text-sm" id="btn-choose-file">📁 Select ZIP File</button>
                        <span id="selected-file-label" class="text-xs text-muted" style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">No file chosen</span>
                        <label class="text-xs inline-flex items-center gap-xs cursor-pointer" title="Automatically overwrite existing scenario with the same ID">
                            <input type="checkbox" id="overwrite-checkbox"> Overwrite
                        </label>
                        <button type="button" class="btn btn-primary text-sm" id="btn-import-scenario" disabled>Import</button>
                    </div>
                </div>
            </div>

            <div id="import-status-banner" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;"></div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th style="text-align: center;">Min Players</th>
                            <th style="text-align: center;">Max Players</th>
                            <th style="text-align: center;">Events</th>
                            <th style="text-align: center;">Version</th>
                            <th style="text-align: center;">Guide</th>
                            <th>Last Updated</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="scenarios-table-body">
                        <tr>
                            <td colspan="8" class="text-center text-muted" style="padding: 2rem;">Loading scenarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- IMAGE LIBRARY TAB -->
        <section id="tab-images" style="display: none;">
            <div class="toolbar">
                <div class="toolbar-left" style="flex: 1; max-width: 800px;">
                    <input type="text" id="image-search" class="search-input" placeholder="Search images by title, ID, or description..." style="flex: 1; min-width: 220px;">
                    <div class="tag-filter-container" style="flex: 1.5; min-width: 280px;">
                        <input id="image-tag-filter" class="tagify-filter-input" placeholder="Filter by tags (type & Tab)...">
                    </div>
                    <button type="button" id="btn-clear-tag-filters" class="btn btn-secondary text-sm" title="Clear all tag filters" style="display: none;">Clear Tags</button>
                </div>
                <div class="toolbar-right">
                    <span id="image-count-label" class="text-sm text-muted">0 images loaded</span>
                </div>
            </div>

            <div class="images-grid" id="images-grid">
                <div class="text-center text-muted" style="grid-column: 1 / -1; padding: 3rem;">Loading image library...</div>
            </div>
        </section>
    </main>

    <!-- Conflict Confirmation Modal -->
    <div class="modal-overlay" id="conflict-modal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h2>Scenario Already Exists</h2>
                <button type="button" class="btn-close" id="btn-close-conflict">&times;</button>
            </div>
            <p id="conflict-modal-message" class="text-sm text-muted" style="margin-bottom: 1.5rem;"></p>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button type="button" class="btn btn-secondary text-sm" id="btn-cancel-conflict">Cancel</button>
                <button type="button" class="btn btn-primary text-sm" id="btn-confirm-overwrite">Overwrite Scenario</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/tagify/tagify.js"></script>
    <script src="js/common.js"></script>
    <script src="js/bug-reporter.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
