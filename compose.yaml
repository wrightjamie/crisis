version: '3.8'

services:
  crisis-app:
    # Uses the pre-built image from GitHub Container Registry
    # image: ghcr.io/wrightjamie/crisis:latest
    # To build locally instead, uncomment 'build' and comment out 'image'
    build: .
    container_name: crisis_app
    ports:
      - "9991:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optional: GitHub personal access token to automatically create real GitHub issues
      # - GITHUB_TOKEN=ghp_your_token_here
      # - GITHUB_REPO=wrightjamie/crisis
    volumes:
      # Mount data directory so bug reports and scenarios persist across container restarts
      - ./data:/usr/src/app/data
